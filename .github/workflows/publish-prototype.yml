name: Publish Dungeon Descent prototype

on:
  push:
    paths:
      - 'downloads/Dungeon-Descent.exe'
      - '.github/workflows/publish-prototype.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify executable file
        run: |
          test -s downloads/Dungeon-Descent.exe
          echo "File information:"
          file downloads/Dungeon-Descent.exe
          sha256sum downloads/Dungeon-Descent.exe
      - name: Publish prototype pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-demo downloads/Dungeon-Descent.exe \
            --title "Dungeon Descent — Prototype v0.1 (Windows x64)" \
            --notes "Early Windows x64 demo of Dungeon Descent, created in C with Win32 API/GDI. This prototype contains unfinished systems, and the Knight's attributes were temporarily adjusted for a classroom presentation. Source code is not included. The executable has not been validated on a clean Windows installation." \
            --prerelease
